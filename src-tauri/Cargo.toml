[package]
name = "housescape"
version = "0.1.1"
description = "Offline personal space planner — geometry prototype"
authors = ["Housescape contributors"]
edition = "2021"
license = "MIT"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
